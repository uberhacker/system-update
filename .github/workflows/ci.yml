name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BATS_REPO: https://github.com/bats-core/bats-core.git
  BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5   # v1.14.0

jobs:
  lint:
    name: shellcheck and bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: tests/lint.sh

  unit:
    name: unit tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bats-core (pinned)
        run: |
          git init -q tests/vendor/bats-core
          git -C tests/vendor/bats-core fetch -q --depth 1 "$BATS_REPO" "$BATS_COMMIT"
          git -C tests/vendor/bats-core checkout -q FETCH_HEAD
      - run: tests/run.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle:
    name: single-file build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh dist/system-update
      - run: dist/system-update --version && dist/system-update --list
      - uses: actions/upload-artifact@v4
        with:
          name: system-update-single-file
          path: dist/system-update

  containers:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:stable
          - fedora:latest
          - rockylinux:9
          - archlinux:latest
          - opensuse/tumbleweed
          - opensuse/leap
          - alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run system-update inside ${{ matrix.image }}
        run: tests/containers.sh "${{ matrix.image }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_TIMEOUT: "5"
      - name: Upload container log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-log-${{ strategy.job-index }}
          path: tests/containers.out/*.log
          if-no-files-found: ignore
